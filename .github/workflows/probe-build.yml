      # 顺序（迭代 4，运行 #4 诊断）：依赖库先于使用者——gnutls-ios、ffmpeg、freetype-ios
      # 在 ntdll-unix 之前（见各步注释）。Madeira docs/BUILDING.md 的「Native build chains」
      # 也是这个顺序：gnutls-ios 与 ffmpeg 列在第 1 位，Wine unix side（ntdll/win32u/wineserver）
      # 列在第 3 位；上游 docs/SOURCE.md 第 1 步只列了名字、未定顺序。

      - name: Build libs - wineserver base archive (tools/build_wineserver_base.sh)
