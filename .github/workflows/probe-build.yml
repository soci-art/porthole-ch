      - name: Build libs - DXMT shader headers + DXMT patches (iteration 3 metal atomic compat)
        working-directory: ${{ github.workspace }}/src
        run: |
          set -euxo pipefail
          # Iteration 3 gate (diagnosis: notes/PROBE-RUN2-DIAGNOSIS.md): the ONLY 5-arg
          # atomic call in this build is manufactured by tools/build_dxmt_shader_headers.sh
          # itself (patch 0002's sed appends ', __METAL_MEMORY_FLAGS_NONE__' for Xcode 27's
          # metal). Gate on a real compile probe of that exact call - NOT on version
          # strings ('metal --version' here prints 32023.883 yet rejects the 5-arg form).
          # Probe OK -> upstream script untouched. Probe fails -> shadow copy of the same
          # script in the same directory (identical path logic), FLAGS append neutralized,
          # diff printed, shadow asserted free of '__METAL_MEMORY_FLAGS_NONE__'.
          {
            echo '--- metal 5-arg atomic capability probe (iteration 3) ---'
            cat > "$RUNNER_TEMP/probe_atomic5.metal" <<'EOF'
          #include <metal_stdlib>
          using namespace metal;
          kernel void probe_atomic5() {
            threadgroup int c;
            __metal_atomic_fetch_add_explicit(&c, 1, int(memory_order_relaxed), __METAL_MEMORY_SCOPE_THREADGROUP__, __METAL_MEMORY_FLAGS_NONE__);
          }
          EOF
            if xcrun -sdk macosx metal -o "$RUNNER_TEMP/probe_atomic5.air" -c "$RUNNER_TEMP/probe_atomic5.metal" -std=metal3.1 --target=air64-apple-macos14.0 2>"$RUNNER_TEMP/probe_atomic5.err"; then
              echo 'METAL_ATOMIC5: supported - upstream script runs as-is'
              tools/build_dxmt_shader_headers.sh
            else
              echo 'METAL_ATOMIC5: NOT supported - probe compiler output:'
              cat "$RUNNER_TEMP/probe_atomic5.err" || true
              echo '--- building compat shadow script (only the FLAGS append is neutralized) ---'
              sed 's/, __METAL_MEMORY_FLAGS_NONE__//' tools/build_dxmt_shader_headers.sh > tools/.probe-build_dxmt_shader_headers.sh
              echo '--- diff: upstream script vs compat shadow (expect exactly one line) ---'
              diff tools/build_dxmt_shader_headers.sh tools/.probe-build_dxmt_shader_headers.sh || true
              test "$(grep -c '__METAL_MEMORY_FLAGS_NONE__' tools/.probe-build_dxmt_shader_headers.sh)" = '0'
              chmod +x tools/.probe-build_dxmt_shader_headers.sh
              tools/.probe-build_dxmt_shader_headers.sh
              rm -f tools/.probe-build_dxmt_shader_headers.sh
              echo '--- compat audit: FLAGS occurrences in generated air_tessellation.patched.metal (expect 0) ---'
              grep -c '__METAL_MEMORY_FLAGS_' vendor/Madeira/build/dxmt-ios/shader-headers/air_tessellation.patched.metal || echo 'none found (0)'
            fi
          } 2>&1 | tee "$PROBE_LOGS/11-dxmt-headers.log" || {
            echo '--- err-*.txt dump (step failed) ---'
            find vendor/Madeira/build build -name 'err-*.txt' -type f 2>/dev/null | while read -r ef; do echo "===== $ef ====="; cat "$ef" || true; done
            exit 1
          }
          tools/apply_dxmt_patch.sh 2>&1 | tee -a "$PROBE_LOGS/11-dxmt-headers.log" || {
            echo '--- err-*.txt dump (step failed) ---'
            find vendor/Madeira/build build -name 'err-*.txt' -type f 2>/dev/null | while read -r ef; do echo "===== $ef ====="; cat "$ef" || true; done
            exit 1
          }

