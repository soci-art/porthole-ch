name: probe-build (Porthole rebuild spike)

on:
  workflow_dispatch:
    inputs:
      probe_id:
        description: 'Probe id (artifact prefix)'
        required: false
        default: 'probe-01'
      target_git_url:
        description: 'Upstream Porthole git URL'
        required: false
        default: 'https://github.com/tylerkaska112/Porthole.git'
      target_git_ref:
        description: 'Upstream Porthole git ref'
        required: false
        default: 'v1.2.1'

permissions:
  contents: read

jobs:
  probe-build:
    runs-on: macos-15
    timeout-minutes: 300
    env:
      IPA_BUILD_NUMBER: '1'
      IPA_VERSION: '1.2.1'
      TOOLCHAIN_REPO: 'https://github.com/kylekyle/iphone-llvm-toolchain.git'
      STIKJIT_REPO: 'https://github.com/StephenDevs/StikJIT.git'
      FEX_REPO: 'https://github.com/PTMT/FEX.git'
      FEX_BRANCH: 'fex-2601'
      FREETYPE_REPO: 'https://github.com/freetype/freetype.git'
      FREETYPE_COMMIT: '4d2d6a4b3d0c6f4b0f8d2a1c9e5b7d3a1f4e6c8b'
      FREETYPE_VERSION: '2.13.2'
      FFMPEG_REPO: 'https://github.com/FFmpeg/FFmpeg.git'
      FFMPEG_BRANCH: 'n7.1'
      GNUTLS_REPO: 'https://github.com/gnutls/gnutls.git'
      GNUTLS_BRANCH: 'gnutls_3_8_x'
    steps:
      - name: Checkout self
        uses: actions/checkout@v4
        with:
          path: self

      - name: Clone upstream Porthole
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.target_git_ref }}" "${{ inputs.target_git_url }}" upstream
          cd upstream
          git rev-parse HEAD
          git status --short

      - name: Install toolchain (Xcode 16.4 + llvm 16.0.6)
        run: |
          set -euo pipefail
          git clone --depth 1 "$TOOLCHAIN_REPO" "$RUNNER_TEMP/toolchain-repo"
          "$RUNNER_TEMP/toolchain-repo/ci/make_toolchain.sh" --target iphoneos-arm64 --target iphonesimulator-arm64 --target macosx-arm64 --with-cctools --with-llvm --with-llvm-version 16.0.6 --with-xcode-version 16.4 --verbose --ci
          echo "IOS_TOOLCHAIN=$RUNNER_TEMP/toolchain/iphoneos-arm64" >> "$GITHUB_ENV"
          echo "SIM_TOOLCHAIN=$RUNNER_TEMP/toolchain/iphonesimulator-arm64" >> "$GITHUB_ENV"
          echo "MACOS_TOOLCHAIN=$RUNNER_TEMP/toolchain/macosx-arm64" >> "$GITHUB_ENV"
          ls "$RUNNER_TEMP/toolchain/iphoneos-arm64/bin" | head -n 50

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install cmake meson ninja nasm pkg-config automake autoconf libtool gmp nettle p11-kit libtasn1 libunistring brotli unbound idn2 libidn2 texinfo help2man bison gettext glib gettext-tools intltool xz coreutils zstd gpgme assuan || true
          brew list --versions cmake meson ninja nasm pkg-config || true

      - name: Verify pinned build inputs
        run: |
          set -euo pipefail
          echo "IPA_VERSION=$IPA_VERSION"
          echo "TOOLCHAIN_REPO=$TOOLCHAIN_REPO"
          echo "FEX_BRANCH=$FEX_BRANCH"
          echo "FREETYPE_COMMIT=$FREETYPE_COMMIT"
          echo "FFMPEG_BRANCH=$FFMPEG_BRANCH"
          echo "GNUTLS_BRANCH=$GNUTLS_BRANCH"
          test -n "$IPA_VERSION"
          test -n "$TOOLCHAIN_REPO"
          test -n "$FEX_BRANCH"
          test -n "$FREETYPE_COMMIT"
          test -n "$FFMPEG_BRANCH"
          test -n "$GNUTLS_BRANCH"

      - name: Download upstream IPA (1.2.1)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original-ipa"
          cd "$RUNNER_TEMP/original-ipa"
          curl -fL -o Porthole.ipa "https://github.com/tylerkaska112/Porthole/releases/download/v1.2.1/Porthole.ipa"
          ls -lh
          file Porthole.ipa
          unzip -l Porthole.ipa | head -n 100

      - name: Apply localization patches
        run: |
          set -euo pipefail
          cp -R self/. upstream/ || true
          cd upstream
          ls -la
          git status --short || true

      - name: Extract runtime from upstream IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/extracted"
          cd "$RUNNER_TEMP/extracted"
          unzip -q "$RUNNER_TEMP/original-ipa/Porthole.ipa"
          find . -maxdepth 4 -type d | sort
          ls -R Payload | head -n 200

      - name: Prepare Local.xcconfig (pinned paths)
        run: |
          set -euo pipefail
          cd upstream
          cat > Local.xcconfig <<'EOF'
          // probe: generated by probe-build workflow
          IOS_TOOLCHAIN = $(IOS_TOOLCHAIN)
          SIM_TOOLCHAIN = $(SIM_TOOLCHAIN)
          MACOS_TOOLCHAIN = $(MACOS_TOOLCHAIN)
          TOOLCHAIN_XCODE = /Applications/Xcode_16.4.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain
          EOF
          cat Local.xcconfig

      - name: Prepare StikJIT (patch only, no build)
        run: |
          set -euo pipefail
          git clone --depth 1 "$STIKJIT_REPO" "$RUNNER_TEMP/StikJIT"
          cd "$RUNNER_TEMP/StikJIT"
          ls -la
          find . -maxdepth 2 -type f | sort | head -n 100

      - name: Build wineserver base (macOS arm64, wineserver only)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wineserver-base"
          cd "$RUNNER_TEMP/wineserver-base"
          echo "wineserver-base placeholder: build step kept minimal in probe"
          ls -la

      - name: Build DXMT headers only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dxmt-headers"
          cd "$RUNNER_TEMP/dxmt-headers"
          echo "dxmt headers placeholder"
          ls -la

      - name: Apply Madeira patch (probe placeholder)
        run: |
          set -euo pipefail
          cd upstream
          ls -la
          echo "madeira patch placeholder"

      - name: Build FEX (fex-2601, iOS arm64)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FEX_BRANCH" "$FEX_REPO" "$RUNNER_TEMP/FEX"
          cd "$RUNNER_TEMP/FEX"
          git rev-parse HEAD
          ls -la

      - name: Build ntdll-unix (iOS arm64)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ntdll-unix"
          cd "$RUNNER_TEMP/ntdll-unix"
          echo "ntdll-unix placeholder"
          ls -la

      - name: Build win32u-unix (iOS arm64)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/win32u-unix"
          cd "$RUNNER_TEMP/win32u-unix"
          echo "win32u-unix placeholder"
          ls -la

      - name: Build wineserver (iOS arm64)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wineserver-ios"
          cd "$RUNNER_TEMP/wineserver-ios"
          echo "wineserver ios placeholder"
          ls -la

      - name: Build dxmt-ios
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dxmt-ios"
          cd "$RUNNER_TEMP/dxmt-ios"
          echo "dxmt-ios placeholder"
          ls -la

      - name: Build ffmpeg (iOS arm64, n7.1)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FFMPEG_BRANCH" "$FFMPEG_REPO" "$RUNNER_TEMP/FFmpeg"
          cd "$RUNNER_TEMP/FFmpeg"
          git rev-parse HEAD
          ls -la | head -n 50

      - name: Build freetype (pinned commit)
        run: |
          set -euo pipefail
          git clone "$FREETYPE_REPO" "$RUNNER_TEMP/freetype"
          cd "$RUNNER_TEMP/freetype"
          git checkout "$FREETYPE_COMMIT"
          git rev-parse HEAD
          ls -la | head -n 50

      - name: Build gnutls (gnutls_3_8_x)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$GNUTLS_BRANCH" "$GNUTLS_REPO" "$RUNNER_TEMP/gnutls"
          cd "$RUNNER_TEMP/gnutls"
          git rev-parse HEAD
          ls -la | head -n 50

      - name: Collect build outputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/probe-output"
          cd "$RUNNER_TEMP/probe-output"
          echo "probe_id=${{ inputs.probe_id }}" > probe-info.txt
          echo "git_ref=${{ inputs.target_git_ref }}" >> probe-info.txt
          date -u +"built_at=%Y-%m-%dT%H:%M:%SZ" >> probe-info.txt
          cat probe-info.txt
          ls -la

      - name: Assemble RuntimeStage from upstream IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/RuntimeStage"
          cp -R "$RUNNER_TEMP/extracted/Payload" "$RUNNER_TEMP/RuntimeStage/" || true
          find "$RUNNER_TEMP/RuntimeStage" -maxdepth 3 | sort | head -n 200
          du -sh "$RUNNER_TEMP/RuntimeStage"

      - name: Generate Xcode project (placeholder)
        run: |
          set -euo pipefail
          cd upstream
          ls -la
          echo "xcodegen placeholder"

      - name: Build app (xcodebuild, unsigned)
        run: |
          set -euo pipefail
          cd upstream
          ls -la
          echo "xcodebuild placeholder: CODE_SIGNING_ALLOWED=NO"

      - name: Package IPA (unsigned)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package"
          cd "$RUNNER_TEMP/package"
          echo "package placeholder"
          ls -la

      - name: Structure diff vs upstream IPA
        run: |
          set -euo pipefail
          echo "=== upstream IPA listing ==="
          unzip -l "$RUNNER_TEMP/original-ipa/Porthole.ipa" | head -n 200
          echo "=== RuntimeStage listing ==="
          find "$RUNNER_TEMP/RuntimeStage" | sort | head -n 200

      - name: Upload probe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.probe_id }}-probe"
          path: |
            ${{ runner.temp }}/probe-output/probe-info.txt
            ${{ runner.temp }}/RuntimeStage
          if-no-files-found: warn
          retention-days: 7
