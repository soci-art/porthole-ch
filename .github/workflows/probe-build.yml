      - name: Collect and audit static libraries (13 required by project.yml)
        working-directory: ${{ github.workspace }}/src
        run: |
          set -euxo pipefail
          STAGE_LIB="$F4_BUILD_ROOT/probe-stage/lib"
          mkdir -p "$STAGE_LIB"
          {
            required="dxmt_combined gmp lzma gnutls hogweed nettle ntdll_unix win32u_unix wineserver avcodec avformat avutil swresample"
            missing=""
            for n in $required; do
              # 全盘找该库：优先非快照路径（本次自建产物），其次 Madeira 快照 app/Madeira/ 里的跟踪成品。
              # 自建产物落在 F4_BUILD_ROOT（= src/build）下；vendor/Madeira/build 为相对 src 的路径。
              built="$(find "$F4_BUILD_ROOT" vendor/Madeira/build -name "lib$n.a" 2>/dev/null | head -1 || true)"
              snap="vendor/Madeira/app/Madeira/lib$n.a"
              if [ -n "$built" ]; then src="$built"; origin="built"
              elif [ -f "$snap" ]; then src="$snap"; origin="snapshot"
              else missing="$missing lib$n.a"; continue; fi
              cp -f "$src" "$STAGE_LIB/lib$n.a"
              echo "lib$n.a  <- $src  ($origin, $(stat -f%z "$src" 2>/dev/null || stat -c%s "$src") bytes)"
            done
            echo '--- liblzma.a 全盘搜索（来源定位，报告未决项 2） ---'
            find "$SRC" -name 'liblzma*' -not -path '*/.git/*' 2>/dev/null || true
            xcrun -sdk iphoneos --show-sdk-path | xargs -I{} sh -c 'ls {}/usr/lib/liblzma* 2>/dev/null' || true
            if [ -n "$missing" ]; then
              echo "MISSING:$missing"
              echo '探针在此步失败属预期失败模式之一：按 PROBE-PLAN 定位表看对应编号的构建日志。'
              exit 1
            fi
            echo "all 13 required libraries collected into $STAGE_LIB"
            ls -l "$STAGE_LIB"
          } 2>&1 | tee "$PROBE_LOGS/21-collect-libs.log"

      - name: Assemble RuntimeStage (libs above + Resources from IPA)
        working-directory: ${{ github.workspace }}/src
        run: |
          set -euxo pipefail
          {
            STAGE="$F4_BUILD_ROOT/probe-stage"
            RES_SRC="$F4_BUILD_ROOT/probe-resources"
            mkdir -p "$STAGE/Resources"
            # 与 tools/stage_runtime.sh 相同的布局语义：目录/文件用符号链接（check_stage.sh 要求
            # 链接目标落在 checkout 或 F4_BUILD_ROOT 内，本步两者都满足），x86_64-vcruntime 为真实空目录。
            for d in nls aarch64-windows arm64ec-windows i386-windows d3d12 gl compat legal licenses; do
              ln -sfn "$RES_SRC/$d" "$STAGE/Resources/$d"
            done
            for f in prefix-template.tar.gz cacert.pem madeira-jit.js; do
              ln -sfn "$RES_SRC/$f" "$STAGE/Resources/$f"
