# Porthole probe build (route B spike) - untranslated English rebuild; only verifies a cloud Mac can rebuild the IPA.
# Basis: notes/INVESTIGATION.md (route B). Pass criteria: probe-ci/PROBE-PLAN.md.
#
# Repo layout (assembly model - this repo stays minimal, CI assembles the source tree):
#   this repo (soci-art/porthole-ch)  : README.md, probe-ci/, notes/ only - no upstream source.
#   this file                         : when landed, lives at .github/workflows/probe-build.yml;
#                                       a reference copy is kept at probe-ci/workflows/probe-build.yml.
#   checkout step                     : checks out THIS repo only (to get probe-ci/scripts), no submodules.
#   clone step                        : clones upstream Porthole at tag v1.2.1 (recursive submodules:
#                                       Madeira + Wine/FEX/DXMT/dock) into $GITHUB_WORKSPACE/src and
#                                       verifies HEAD = 0786a24fa97647491c942db6279ad3610dcbb48a.
#   probe-ci/ is then copied into src/ so every later step runs with working-directory = src and the
#   scripts' original relative-path assumptions hold unchanged (probe-ci/scripts/*.sh, tools/*,
#   vendor/*, app/* ...). F4_BUILD_ROOT lives inside src (src/build); PROBE_OUT / PROBE_LOGS stay
#   at the workspace root so the artifact-upload step finds them from any working directory.
#
# Manual trigger only (workflow_dispatch): the probe is expensive and expected to iterate.
#
# Iteration 2 (after run #1, 2026-11-08 - diagnosis: notes/PROBE-RUN1-DIAGNOSIS.md):
#   Run #1 failed at "Build libs - wineserver base archive": all 23 Wine server objects failed
#   in ~5s. Root cause (verified): wine/build-macos/ does not exist in a clean clone - it is the
#   author's local host-configured Wine tree, and every wine/server/*.c starts with
#   #include "config.h", which only wine/build-macos/include provides. Neither Porthole's
#   build_wineserver_base.sh nor Madeira's bootstrap-base.sh creates it; Madeira's
#   build/wine-macos/configure.sh does (and says so in its header). docs/SOURCE.md omits this
#   prerequisite entirely. Iteration 2 therefore adds a "Prepare wine/build-macos" step
#   (setup-llvm-mingw.sh -> build/wine-macos/configure.sh -> Porthole tools/fix_macos_config.sh)
#   before the library builds, adds freetype/gnutls to the Homebrew set (configure.sh needs
#   them), and adds failure diagnostics to every library step plus an always() collector that
#   sweeps err-*.txt files into probe-logs so the next failure is readable from the artifact.
#
# Iteration 3 (after run #2, 2026-11-08 - diagnosis: notes/PROBE-RUN2-DIAGNOSIS.md):
#   Run #2 got past wineserver base (23/23 objects, archive built - the iteration 2 fix is
#   verified) and failed at "Build libs - DXMT shader headers":
#   air_tessellation.patched.metal:153 'too many arguments to function call, expected 4,
#   have 5'. DXMT's pinned source has exactly ONE __metal_atomic_fetch_add_explicit call
#   (src/airconv/shaders/air_tessellation.metal, in get_next_index) and it passes 4 args;
#   repo-wide there are ZERO '__METAL_MEMORY_FLAGS_' occurrences in DXMT. The 5th argument
#   is manufactured by Porthole's own tools/build_dxmt_shader_headers.sh (its patch 0002):
#   its sed appends ', __METAL_MEMORY_FLAGS_NONE__' because Xcode 27's metal intrinsic
#   REQUIRES 5 args. This runner's metal (Xcode 26.6) accepts only 4 - although
#   'metal --version' prints 32023.883, the very number the script's comment associates
#   with Xcode 27, so version strings cannot be trusted as the gate. Iteration 3:
#   (1) the toolchain step now enumerates every /Applications/Xcode*.app with its REAL
#       version (the old filename sort -V could never select the unversioned Xcode.app,
#       because '.' sorts before '_') and selects the true maximum - run #3's
#       01-toolchain.log will state Xcode.app's real version either way;
#   (2) the DXMT headers step is gated on an actual compile probe of the exact 5-arg
#       call: probe compiles -> the upstream script runs completely untouched; probe
#       fails -> a shadow copy of the SAME script in the SAME directory (identical path
#       logic) with only the FLAGS append neutralized runs instead. The diff is printed
#       and the shadow is asserted to contain zero '__METAL_MEMORY_FLAGS_NONE__'.
#       Equivalence: __METAL_MEMORY_FLAGS_NONE__ is defined as 0 = no extra flags, which
#       is exactly what the 4-arg form means; patch 0002 itself states 'Semantics
#       unchanged (flags NONE)', and DXMT's own meson compiles the unpatched 4-arg
#       source. The two paths are mutually exclusive by construction of the probe.

# Iteration 4 (after run #4, 2026-11-08 - diagnosis: notes/PROBE-RUN4-DIAGNOSIS.md):
#   Run #4 got to step 17 "Build libs - Madeira build/ntdll-unix": 36/41 unixlibs OK,
#   5 FAILED (bcrypt/secur32/crypt32/dwrite/winegstreamer), then ar failed on the 5
#   missing .o files. Iteration 3.1's two fixes are VERIFIED (toolchain enum: Xcode.app
#   really is 26.6; DXMT compat probe + shadow script, FLAGS count 0; wineserver 23/23;
#   FEX 100%) - none of those steps are touched here. The failures split into two
#   dependency-order gaps, both confirmed against the pinned Madeira sources, not
#   guessed from the log (run #4's log carries no per-lib compiler output at all):
#   (1) bcrypt/secur32/crypt32: build/ntdll-unix/build.sh warns verbatim that
#       toolchains/gnutls-ios/lib/libgnutls.a is missing and compiles the three to
#       empty objects - and gnutls-ios was step 22, AFTER ntdll-unix (step 17).
#       Madeira docs/BUILDING.md lists gnutls-ios and ffmpeg FIRST in its native
#       build chains, Wine unix side third; the two build scripts' own headers name
#       their consumers (gnutls-ios -> the three crypto unixlibs; ffmpeg ->
#       winegstreamer's unix side, which reads toolchains/ffmpeg-ios/include).
#       So gnutls-ios, ffmpeg and freetype-ios all move BEFORE ntdll-unix.
#       freetype-ios also matters for dwrite: research/freetype/ is NOT in the repo
#       (only metal-blend-test/remote-metal are tracked under research/), and
#       freetype-ios/build.sh is what clones freetype 2.13.3 into research/freetype -
#       dwrite's TU reads research/freetype/include.
#   (2) dwrite: its TU also reads wine/build-arm64ec/include for widl-generated
#       dwrite.h/dwrite_3.h, and NO probe step ever created that tree (same class
#       of gap as run #1's build-macos). New step "Prepare wine/build-arm64ec"
#       runs the arm64ec block of Madeira tools/build/build-wine.sh verbatim
#       (configure --enable-archs=arm64ec, then make only include/dwrite.h and
#       include/dwrite_3.h). Run #5's logs will prove or refute (2): the .err
#       capture below is what makes that possible.
#   (3) Diagnostics: build/ntdll-unix/build.sh (and win32u-unix) write each
#       unit's compiler stderr to obj/<name>.err - NOT err-*.txt - which is why
#       run #4's 99-err-dump.log and all 23 err-dump files were 0 bytes. The
#       ntdll/win32u failure branches now print non-empty obj/*.err, and the
#       always() collector also sweeps *.err into probe-logs/err-dump/.

# Iteration 5 (after run #5, 2026-11-08 - diagnosis: notes/PROBE-RUN5-DIAGNOSIS.md):
#   Run #5 failed at the NEW step 13 "Prepare wine/build-arm64ec" (3s): configure
#   reported 'arm64ec PE cross-compiler not found'. The run #5 diagnosis first
#   blamed a missing compiler - that is WRONG, and run #5's own step-12 log proves
#   it: 07-wine-macos.log line 36-37 shows the SAME configure finding
#   'arm64ec-w64-mingw32-clang... arm64ec-w64-mingw32-clang' and its capability
#   probe answering YES. llvm-mingw 20260421 ships the compiler (Madeira's
#   setup-llvm-mingw.sh asserts its presence and step 12 would have failed
#   without it). The real defect is in the iteration-4 step itself: it put the
#   toolchain on PATH as a RELATIVE entry
#   ('vendor/Madeira/toolchains/llvm-mingw-.../bin') and then ran configure from a
#   subshell that had cd'd into vendor/Madeira/wine/build-arm64ec - PATH entries
#   resolve against the process cwd, so from there the relative entry pointed at
#   a nonexistent directory and configure saw no compiler. Step 12 never hit
#   this because Madeira's build/wine-macos/configure.sh exports the toolchain
#   via an ABSOLUTE path ($R/toolchains/...). Iteration 5 therefore keeps the
#   verbatim configure+make (no new toolchain, no widl shortcut) and only fixes
#   the PATH to absolute, plus a pre-flight 'test -x .../arm64ec-w64-mingw32-clang'
#   so a genuinely missing compiler fails fast with a readable message instead
#   of configure's generic one. Corollary, verified against the pinned sources
#   (see PROBE-RUN5-DIAGNOSIS.md '迭代 5 修法'): the dwrite TU's only use of
#   build-arm64ec/include is the -I flag in build/ntdll-unix/build.sh:155, and
#   build-macos/configure.sh itself configures --enable-archs=arm64ec and its
#   step-12 log already shows widl generating dwrite.h/dwrite_3.h in
#   build-macos/include - so reusing those headers would also be equivalent;
#   it is kept as the documented fallback, not implemented, because the
#   verbatim configure is now proven runnable on this runner.

name: probe-build (Porthole rebuild spike)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REPO_URL: https://github.com/tylerkaska112/Porthole.git
  UPSTREAM_TAG: v1.2.1
  UPSTREAM_HEAD: 0786a24fa97647491c942db6279ad3610dcbb48a
  SRC: ${{ github.workspace }}/src
  UPSTREAM_IPA_URL: https://github.com/tylerkaska112/Porthole/releases/download/v1.2.1/Porthole-1.2.1-688.ipa
  UPSTREAM_IPA_SHA256: 5a6d06aa00cd05d76c5fab1a0a0380a38c43fcdd4790bf6f845744fb7e0dfaf7
  # Default build root of stage_runtime.sh / check_stage.sh (tools/local.env is not committed;
  # in CI use a path inside the cloned source tree instead of the author's external drive).
  F4_BUILD_ROOT: ${{ github.workspace }}/src/build
  PROBE_OUT: ${{ github.workspace }}/probe-output
  PROBE_LOGS: ${{ github.workspace }}/probe-logs

defaults:
  run:
    shell: bash

jobs:
  probe:
    # Runner choice: docs/SOURCE.md asks for Xcode 27 + its Metal toolchain. macos-26 (macOS 26)
    # is the newest GitHub-hosted macOS image and ships the newest Xcode line, closest to the ask.
    # [UNKNOWN] Whether any hosted image already provides Xcode 27 cannot be pre-verified; the
    # toolchain step below lists every Xcode in /Applications, selects the newest, and records
    # the real versions in the logs/artifacts - confirming this is the probe's first job.
    # If the macos-26 label is unavailable when the repo goes live, fall back to macos-15 and
    # record the version gap in PROBE-PLAN.
    runs-on: macos-26
    # Duration is unknown (first from-scratch rebuild of the engine libs on a clean machine;
    # upstream docs/SOURCE.md admits it has never been done). 360 min is the hosted-runner
    # per-job cap; if the probe times out, split jobs or add caching (see PROBE-PLAN unknowns).
    timeout-minutes: 360

    steps:
      - name: Checkout this repo (probe-ci scripts only - no submodules, no source)
        uses: actions/checkout@v4

      - name: Clone upstream Porthole v1.2.1 into src (recursive submodules) and verify pinned HEAD
        run: |
          set -euxo pipefail
          mkdir -p "$PROBE_LOGS" "$PROBE_OUT"
          {
            git clone --branch "$UPSTREAM_TAG" --recurse-submodules "$UPSTREAM_REPO_URL" "$SRC"
            # Belt and braces: vendor/Madeira is a submodule with its own wine/FEX/dxmt/madeira-dock
            # submodules; all pinned, all needed - make sure the nested ones are all present.
            git -C "$SRC" submodule update --init --recursive
            head_sha="$(git -C "$SRC" rev-parse HEAD)"
            echo "upstream HEAD: $head_sha (expect $UPSTREAM_HEAD, tag $UPSTREAM_TAG)"
            test "$head_sha" = "$UPSTREAM_HEAD"
            git -C "$SRC" submodule status --recursive | head -40
            # probe-ci scripts assume they sit at the source repo root (probe-ci/scripts/*.sh);
            # copy probe-ci into the cloned tree so all later steps keep those relative paths.
            cp -R "$GITHUB_WORKSPACE/probe-ci" "$SRC/probe-ci"
            ls "$SRC/probe-ci/scripts"
          } 2>&1 | tee "$PROBE_LOGS/00-clone-upstream.log"

      - name: Toolchain report (Xcode / xcodegen / clang / tools)
        run: |
          set -euxo pipefail
          mkdir -p "$PROBE_LOGS" "$PROBE_OUT"
          {
            sw_vers || true
            echo '--- Xcodes in /Applications ---'
            ls /Applications | grep -i xcode || true
            echo '--- every Xcode in /Applications, with its REAL version (iteration 3) ---'
            # Runs #1/#2 selected by filename (sort -V), which can never pick the
            # unversioned Xcode.app ('.' sorts before '_'), so a 27.x hiding behind
            # Xcode.app would have been silently ignored. Enumerate real versions
            # via DEVELOPER_DIR and select the true maximum; this log line is the
            # authoritative answer to "what is Xcode.app" for this runner image.
            best_ver=''; newest=''
            for app in /Applications/Xcode*.app; do
              [ -d "$app/Contents/Developer" ] || continue
              # Iteration 3.1 (after run #3): run #3 died HERE with exit 134 (SIGABRT) -
              # DEVELOPER_DIR xcodebuild -version ABORTED inside the command substitution
              # for /Applications/Xcode_26.2.app, and set -e + pipefail turned that abort
              # into a step failure before any real build step ran. Never execute a
              # foreign Xcode's xcodebuild just to learn its version: read the version
              # from the app bundle's Info.plist (pure file read, cannot abort); keep an
              # xcodebuild fallback only, fully guarded with || true.
              ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" 2>/dev/null || true)"
              if [ -z "$ver" ]; then ver="$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version 2>/dev/null | head -1 | awk '{print $2}' || true)"; fi
              echo "XCODE_ENUM $app -> ${ver:-UNREADABLE}"
              [ -n "$ver" ] || continue
              if [ -z "$best_ver" ] || [ "$(printf '%s\n%s\n' "$best_ver" "$ver" | sort -V | tail -1)" = "$ver" ]; then best_ver="$ver"; newest="$app"; fi
            done
            echo "--- select newest Xcode: ${newest:-none} (real version ${best_ver:-unknown}) ---"
            if [ -n "$newest" ]; then sudo xcode-select -s "$newest/Contents/Developer"; fi
            xcode-select -p
            xcodebuild -version
            echo '--- compilers & build tools ---'
            clang --version | head -2
            xcrun -sdk iphoneos --show-sdk-path
            xcrun -sdk macosx metal --version || echo 'metal toolchain: NOT FOUND (DXMT shader headers step needs it)'
            command -v xcodegen && xcodegen --version || echo 'xcodegen: NOT INSTALLED (next step installs)'
            command -v cmake && cmake --version | head -1 || echo 'cmake: not installed'
            command -v ninja && ninja --version || echo 'ninja: not installed'
            command -v meson && meson --version || echo 'meson: not installed'
          } 2>&1 | tee "$PROBE_LOGS/01-toolchain.log"

      - name: Install build tools (Homebrew - xcodegen/cmake/ninja/meson)
        run: |
          set -euxo pipefail
          # [UNKNOWN] There is no authoritative list of host tools Madeira's build scripts need;
          # install the common source-build set. Anything missing shows up as "command not found"
          # in the matching step log - see the failure table in PROBE-PLAN.md.
          # freetype + gnutls are required by Madeira's build/wine-macos/configure.sh (iteration 2):
          # config.h must enable the font/crypto code the unix libraries compile against.
          # Iteration 6 (after run #6): +llvm. Madeira build/wineserver/build.sh
          # (5fda6a0, lines 442-444) ends with an objcopy sweep that needs
          # llvm-objcopy, looked up via `command -v` or `brew --prefix llvm`;
          # run #6 compiled all 27 wineserver objects fine and died only on
          # that missing binary. brew llvm is keg-only; `brew --prefix llvm`
          # resolves without linking, which is exactly the script's fallback.
          brew install xcodegen cmake ninja meson pkg-config autoconf automake libtool bison flex gettext freetype gnutls llvm || \
            brew install xcodegen cmake ninja meson pkg-config freetype gnutls llvm
          xcodegen --version
          cmake --version | head -1
          echo 'export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"' >> "$GITHUB_ENV" || true

      - name: Verify pinned commits (Madeira + nested submodules)
        working-directory: ${{ github.workspace }}/src
        run: |
          set -euxo pipefail
          {
            git submodule status --recursive
            test "$(git -C vendor/Madeira rev-parse HEAD)" = "5fda6a0e9543e5de1df010aff35748ab913fd0d9"
            # The four nested pins are from the "Pinned upstream commits" table in docs/SOURCE.md;
            # submodule status prints each submodule HEAD first on its line - check all four appear.
            status="$(git submodule status --recursive)"
            for sha in 80c859a76e1073bd41095b1b0abc43135efdd475 \
                       1dc6ed4932bd231df1c53dd7b8043ffdee0ac34a \
                       1f617cd5bbe7a71bc0ad9083589cb44c747cdc9b \
                       67780ba92e60dbfac4fe80eaf2ce34b9ea1a1c60; do
              echo "$status" | grep -q "$sha" || { echo "MISSING pinned commit $sha"; exit 1; }
            done
            echo 'all pinned commits match docs/SOURCE.md'
          } 2>&1 | tee "$PROBE_LOGS/02-pinned-commits.log"

      - name: Download upstream IPA and verify sha256
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/Porthole-1.2.1-688.ipa" "$UPSTREAM_IPA_URL"
          echo "$UPSTREAM_IPA_SHA256  $RUNNER_TEMP/Porthole-1.2.1-688.ipa" | shasum -a 256 -c -
          ls -l "$RUNNER_TEMP/Porthole-1.2.1-688.ipa"
          echo "UPSTREAM_IPA=$RUNNER_TEMP/Porthole-1.2.1-688.ipa" >> "$GITHUB_ENV"

      - name: Apply engine patches 0172-0176 (docs/SOURCE.md step 0)
        working-directory: ${{ github.workspace }}/src
        run: |
          set -euxo pipefail
          {
            git -C vendor/Madeira apply --whitespace=nowarn ../../patches/0172-engine-r28-madeira.patch
            git -C vendor/Madeira/FEX apply --whitespace=nowarn ../../../patches/0173-engine-r28-fex.patch
            git -C vendor/Madeira/wine apply --whitespace=nowarn ../../../patches/0174-engine-r28-wine.patch
            git -C vendor/Madeira/dxmt apply --whitespace=nowarn ../../../patches/0175-engine-r28-dxmt.patch
            git -C vendor/Madeira/madeira-dock apply --whitespace=nowarn ../../../patches/0176-engine-r28-madeira-dock.patch
            echo 'patches 0172-0176 applied'
            # Diagnostic only (not a gate): the engine input digest recorded in Engine.xcconfig
            # should match the current source (pin + all patches + Runtime glue).
            tools/engine.sh show || true
          } 2>&1 | tee "$PROBE_LOGS/03-patches.log"

      - name: Extract runtime Resources from upstream IPA
        working-directory: ${{ github.workspace }}/src
        run: |
          set -euxo pipefail
          # Resources come from the IPA (report B-2: the Madeira snapshot lacks the i386 farm,
          # the gl dylibs and more, so stage_runtime.sh alone cannot produce the full set).
          # probe-ci/ was copied into src/ by the clone step, so this relative path resolves here.
          bash probe-ci/scripts/extract_runtime_resources.sh \
            "$UPSTREAM_IPA" "$F4_BUILD_ROOT/probe-resources" \
            --manifest "$PROBE_OUT/resources-manifest.txt" \
            --sha256 "$UPSTREAM_IPA_SHA256" \
            2>&1 | tee "$PROBE_LOGS/04-extract-resources.log"

      - name: Prepare Local.xcconfig (official build identity values)
        working-directory: ${{ github.workspace }}/src
        run: |
          set -euxo pipefail
          # The script's argument is the SOURCE repo root - now src/, not the workspace root.
          bash probe-ci/scripts/prepare_local_xcconfig.sh "$SRC" \
            2>&1 | tee "$PROBE_LOGS/05-local-xcconfig.log"

      - name: Prepare StikJIT framework (tools/prepare_stikjit.py)
        working-directory: ${{ github.workspace }}/src
        run: |
          set -euxo pipefail
          # The script itself verifies a pinned SHA-256 (444b8d43...7e85) and installs
          # StikJIT 1.5.0 from the official StikDebug release into app/Vendor/.
          python3 tools/prepare_stikjit.py 2>&1 | tee "$PROBE_LOGS/06-stikjit.log"
          ls app/Vendor/StikJIT.xcframework

      - name: Prepare wine/build-macos (llvm-mingw + configure + fix config.h) - iteration 2
        working-directory: ${{ github.workspace }}/src
        run: |
          set -euxo pipefail
          {
            # 根因修复（运行 #1 诊断，notes/PROBE-RUN1-DIAGNOSIS.md）：wine/build-macos 是作者本机的
            # 主机配置构建树，干净克隆里不存在；wine/server/*.c 第一行 #include "config.h" 只能由
            # wine/build-macos/include 提供，缺它时全部对象在预处理阶段失败（运行 #1 第 12 步 23/23 全灭）。
            # Madeira 的 build/wineserver/bootstrap-base.sh 与 Porthole 的 build_wineserver_base.sh
            # 都只是「用现成 build-macos 编底档」，不生成它；唯一生成者是 Madeira 自己的
            # build/wine-macos/configure.sh（其文件头明说 Nothing else creates it）。docs/SOURCE.md
            # 漏写了这一步。下面三步全是项目自带脚本，按作者本机流程原样执行：
            # 1) setup-llvm-mingw.sh：把 llvm-mingw 20260421（带固定 sha256）下到 vendor/Madeira/toolchains/，
            #    configure.sh 的 --enable-archs=arm64ec 需要它提供的 arm64ec-w64-mingw32-clang。
            bash vendor/Madeira/tools/build/setup-llvm-mingw.sh
            # 2) configure.sh：在 wine/build-macos 里跑 ../configure 并生成全部 widl 头，
            #    自检 include/config.h、include/wtypes.h、include/dwrite.h 必须存在。
            bash vendor/Madeira/build/wine-macos/configure.sh
            # 3) fix_macos_config.sh（Porthole 自带）：把新生成的 config.h 与作者原构建树对齐 3 行
            #    （GnuTLS 两个 define 打开、HAVE_PIPE2 关掉）；brew gnutls 已装时前两处 sed 自动无操作。
            tools/fix_macos_config.sh
            ls -l vendor/Madeira/wine/build-macos/include/config.h
            echo 'wine/build-macos ready'
          } 2>&1 | tee "$PROBE_LOGS/07-wine-macos.log"

      - name: Prepare wine/build-arm64ec (dwrite headers) - iteration 5
        working-directory: ${{ github.workspace }}/src
        run: |
          set -euxo pipefail
          # 迭代 5（运行 #5 诊断，notes/PROBE-RUN5-DIAGNOSIS.md）：ntdll-unix 的 dwrite 单元
          # 编译 vendor/Madeira/build/ntdll-unix/dwrite_freetype_ios.c，它 -I
          # wine/build-arm64ec/include 取 widl 生成的 dwrite.h/dwrite_3.h；干净克隆里这棵树
          # 不存在（与运行 #1 的 build-macos 是同一类「作者本机构建树缺失」），此前没有任何
          # 步骤创建它。下面逐字照搬 Madeira tools/build/build-wine.sh（5fda6a0）里生成该树的
          # 一段：configure --enable-archs=arm64ec，再只 make 两个 dwrite 头文件（不走整树构建）。
          # 迭代 4 的教训（运行 #5 的真根因）：第 13 步曾把 llvm-mingw 用相对路径挂上 PATH，
          # 再 cd 进 build-arm64ec 子目录跑 configure——PATH 相对项按进程当前目录解析，cd 后
          # 便指向不存在的目录，configure 遂报找不到编译器；而运行 #5 自身的第 12 步日志证明
          # 编译器本就存在且可用（build-macos/configure.sh 用绝对路径 $R/toolchains/... 挂 PATH，
          # configure 当场找到 arm64ec-w64-mingw32-clang 且能力探测为 yes）。所以本步改用绝对
          # 路径挂 PATH，并在 configure 前先验 test -x：编译器真缺失时直接报明错，不再让
          # configure 的通用报错误导诊断。注意 build-macos/configure.sh 本身也是
          # --enable-archs=arm64ec 配置、第 12 步日志已显示 widl 在 build-macos/include 里生成
          # 了 dwrite.h/dwrite_3.h——复用那份头是等价的备用路线，见诊断附录；主路线仍走原样
          # configure，因为它已被证明能在本运行器上跑通。
          {
            TOOLCHAIN="$GITHUB_WORKSPACE/src/vendor/Madeira/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin"
            export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$TOOLCHAIN:$PATH"
            test -x "$TOOLCHAIN/arm64ec-w64-mingw32-clang" || { echo 'ERROR: arm64ec-w64-mingw32-clang not found in llvm-mingw toolchain' >&2; ls "$TOOLCHAIN" | head -20; exit 1; }
            WINE=vendor/Madeira/wine
            if [ ! -f "$WINE/build-arm64ec/Makefile" ]; then
              echo 'Configuring Wine (ARM64EC headers)...'
              mkdir -p "$WINE/build-arm64ec"
              (cd "$WINE/build-arm64ec" && ../configure --enable-archs=arm64ec --without-x --disable-tests --without-freetype --without-gnutls --enable-winegstreamer)
            fi
            make -C "$WINE/build-arm64ec" -j"$(sysctl -n hw.ncpu)" include/dwrite.h include/dwrite_3.h
            test -f "$WINE/build-arm64ec/include/dwrite.h"
            test -f "$WINE/build-arm64ec/include/dwrite_3.h"
            echo 'wine/build-arm64ec dwrite headers ready'
